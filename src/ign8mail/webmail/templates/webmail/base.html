<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ign8mail{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0f14;
      --surface: #161b25;
      --surface2: #1a2030;
      --border: #1e2738;
      --border2: #253045;
      --accent: #3b82f6;
      --accent-dim: rgba(59,130,246,.12);
      --text: #e2e8f0;
      --muted: #64748b;
      --muted2: #475569;
      --flame: #f97316;
      --green: #22c55e;
      --yellow: #eab308;
      --red: #ef4444;
      --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      display: flex;
      flex-direction: column;
    }

    /* ── Top bar ── */
    .topbar {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0 1.25rem;
      height: 48px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .topbar-logo {
      font-family: var(--mono);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      text-decoration: none;
    }
    .topbar-logo span { color: var(--flame); }
    .topbar-domain {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
    }

    /* ── Shell ── */
    .shell {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 240px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .sidebar-head {
      padding: 0.75rem 1rem 0.5rem;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .mb-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.55rem 1rem;
      text-decoration: none;
      color: var(--muted2);
      border-left: 2px solid transparent;
      transition: background 0.1s, color 0.1s;
    }
    .mb-item:hover { background: var(--surface2); color: var(--text); }
    .mb-item.active { border-left-color: var(--accent); color: var(--text); background: var(--accent-dim); }
    .mb-item.disabled { color: var(--muted); }
    .mb-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.82rem; }
    .mb-badge {
      font-size: 0.68rem;
      font-weight: 600;
      background: var(--accent);
      color: #fff;
      border-radius: 10px;
      padding: 1px 6px;
      min-width: 18px;
      text-align: center;
    }
    .mb-badge.zero { background: transparent; color: var(--muted); }
    .mb-badge.error { background: var(--border2); color: var(--muted); }
    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot-active { background: var(--green); }
    .dot-pending { background: var(--yellow); }
    .dot-disabled { background: var(--muted); }
    .dot-autocreated { background: var(--accent); }

    /* ── Main ── */
    .main {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    /* ── Shared components ── */
    .page-header {
      padding: 1rem 1.5rem 0.75rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .page-header h1 { font-size: 1rem; font-weight: 600; }
    .page-header .sub { font-size: 0.78rem; color: var(--muted); font-family: var(--mono); }

    .tag {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 4px;
    }
    .tag-pending { background: rgba(234,179,8,.15); color: var(--yellow); }
    .tag-active { background: rgba(34,197,94,.12); color: var(--green); }
    .tag-disabled { background: var(--border2); color: var(--muted); }
    .tag-autocreated { background: var(--accent-dim); color: var(--accent); }

    /* ── Action buttons ── */
    .btn {
      font-size: 0.75rem;
      font-weight: 500;
      padding: 0.3rem 0.75rem;
      border-radius: 6px;
      border: 1px solid var(--border2);
      cursor: pointer;
      background: var(--surface2);
      color: var(--muted2);
      font-family: var(--sans);
      transition: background 0.1s, color 0.1s;
    }
    .btn:hover { background: var(--border2); color: var(--text); }
    .btn-danger { border-color: rgba(239,68,68,.3); color: var(--red); }
    .btn-danger:hover { background: rgba(239,68,68,.1); }
    .btn-warn { border-color: rgba(234,179,8,.3); color: var(--yellow); }
    .btn-warn:hover { background: rgba(234,179,8,.08); }

    .actions { display: flex; gap: 0.5rem; margin-left: auto; }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>
<div class="topbar">
  <a class="topbar-logo" href="/">ign<span>8</span>mail</a>
  <span class="topbar-domain">@{{ domain }}</span>
</div>
<div class="shell">
  <nav class="sidebar">
    <div class="sidebar-head">Mailboxes</div>
    {% for mb in sidebar_mailboxes %}
    <a class="mb-item {% if mb.name == active_mailbox %}active{% endif %} {% if mb.status == 'disabled' %}disabled{% endif %}"
       href="{% url 'mailbox' mb.name %}">
      <span class="status-dot {% if mb.status == 'pending' or mb.status == 'enabled' %}dot-pending{% elif mb.status == 'disabled' %}dot-disabled{% elif mb.is_autocreated %}dot-autocreated{% else %}dot-active{% endif %}"></span>
      <span class="mb-name">{{ mb.name }}</span>
      {% if not mb.reachable %}
        <span class="mb-badge error">?</span>
      {% elif mb.unread > 0 %}
        <span class="mb-badge">{{ mb.unread }}</span>
      {% else %}
        <span class="mb-badge zero">·</span>
      {% endif %}
    </a>
    {% endfor %}
  </nav>
  <div class="main">
    {% block content %}{% endblock %}
  </div>
</div>
</body>
</html>
