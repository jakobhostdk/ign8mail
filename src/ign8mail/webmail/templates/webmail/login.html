<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ign8mail — sign in</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0f14;
      --surface: #161b25;
      --border: #1e2738;
      --border2: #253045;
      --accent: #3b82f6;
      --text: #e2e8f0;
      --muted: #64748b;
      --flame: #f97316;
      --red: #ef4444;
      --mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem 2.75rem;
      width: 100%;
      max-width: 360px;
    }
    .logo {
      font-family: var(--mono);
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.4rem;
      text-align: center;
    }
    .logo span { color: var(--flame); }
    .sub {
      text-align: center;
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 1.75rem;
      font-family: var(--mono);
    }
    label {
      display: block;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.4rem;
      margin-top: 0.85rem;
    }
    label:first-of-type { margin-top: 0; }
    input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border2);
      border-radius: 7px;
      color: var(--text);
      font-size: 0.9rem;
      font-family: var(--mono);
      padding: 0.55rem 0.75rem;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: var(--accent); }
    .error {
      font-size: 0.78rem;
      color: var(--red);
      margin-top: 0.85rem;
      min-height: 1.1rem;
    }
    button {
      margin-top: 1.25rem;
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.6rem;
      cursor: pointer;
      font-family: var(--sans);
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.88; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">ign<span>8</span>mail</div>
    <div class="sub">@{{ domain }}</div>
    <form method="post">
      {% csrf_token %}
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autofocus autocomplete="username" autocapitalize="off" spellcheck="false">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password">
      <div class="error">{{ error }}</div>
      <button type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
